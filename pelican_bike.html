<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 2D 动画 - SVG Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
      color: #f8fafc;
      transition: background-color 0.8s ease;
    }

    /* Main animation frame */
    .animation-wrapper {
      position: relative;
      width: 95vw;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      max-height: 85vh;
      background: #020617;
      border-radius: 24px;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg#stage {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating frosted-glass control bar */
    .control-panel {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 22px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      z-index: 50;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-panel:hover {
      background: rgba(15, 23, 42, 0.92);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border: none;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
    }

    .btn.primary:hover {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.55);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.2);
    }

    .speed-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 85px;
      height: 6px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.85);
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    /* Top Title banner */
    .title-banner {
      position: absolute;
      top: 22px;
      left: 26px;
      z-index: 40;
      pointer-events: none;
    }

    .title-banner h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-banner p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    /* Status badge (Top Right) */
    .status-badge {
      position: absolute;
      top: 22px;
      right: 26px;
      background: rgba(15, 23, 42, 0.68);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 12.5px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 7px;
      z-index: 40;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    /* Keyboard Shortcuts hint */
    .keyboard-hint {
      position: absolute;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.3px;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Toast notification */
    .toast-msg {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(245, 158, 11, 0.95);
      color: #000;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    }
    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* SVG Keyframes Animations */
    @keyframes bikeJitter {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-1.8px) rotate(-0.35deg); }
      50% { transform: translateY(0.6px) rotate(0.1deg); }
      75% { transform: translateY(-1.2px) rotate(0.25deg); }
    }

    @keyframes scarfWave {
      0%, 100% {
        d: path("M 465 242 Q 430 228 395 248 Q 375 258 345 238 Q 375 226 410 216 Q 442 212 465 235 Z");
      }
      50% {
        d: path("M 465 242 Q 435 258 400 236 Q 380 218 340 252 Q 370 240 405 246 Q 438 246 465 235 Z");
      }
    }

    @keyframes pouchBreathe {
      0%, 100% { transform: scale(1) translateY(0px); }
      50% { transform: scale(1.03, 1.06) translateY(2px); }
    }

    @keyframes fishWiggle {
      0%, 100% { transform: rotate(-6deg) translateY(0); }
      50% { transform: rotate(8deg) translateY(-3px); }
    }

    @keyframes eyeBlink {
      0%, 93%, 97%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
  </style>
</head>
<body>

  <div class="animation-wrapper">
    <!-- Header title -->
    <div class="title-banner">
      <h1>
        <span>🚴‍♂️</span> 鹈鹕的悠闲骑行
      </h1>
      <p>矢量 SVG 2D 逐帧动力学联动 · 道路标线与流动行道树</p>
    </div>

    <!-- Status badge -->
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="speedIndicator">巡航速度: 1.0x</span>
    </div>

    <!-- Toast alert for bells / squawks -->
    <div class="toast-msg" id="toast">🔔 叮铃铃~ 请注意避让！</div>

    <!-- Keyboard shortcuts helper -->
    <div class="keyboard-hint">快捷键: [空格] 播放/暂停 · [B] 车铃 · [H] 鸣叫 · [T] 昼夜 · [↑/↓] 调速</div>

    <!-- Main SVG Scene -->
    <svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Day Sky Gradient -->
        <linearGradient id="skyGradDay" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="40%" stop-color="#bae6fd"/>
          <stop offset="70%" stop-color="#e0f2fe"/>
          <stop offset="100%" stop-color="#fdf4ff"/>
        </linearGradient>

        <!-- Sunset Sky Gradient -->
        <linearGradient id="skyGradSunset" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#312e81"/>
          <stop offset="28%" stop-color="#9333ea"/>
          <stop offset="60%" stop-color="#f97316"/>
          <stop offset="82%" stop-color="#fde047"/>
          <stop offset="100%" stop-color="#fed7aa"/>
        </linearGradient>

        <!-- Night Sky Gradient -->
        <linearGradient id="skyGradNight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#020617"/>
          <stop offset="45%" stop-color="#0f172a"/>
          <stop offset="75%" stop-color="#1e1b4b"/>
          <stop offset="100%" stop-color="#2e1065"/>
        </linearGradient>

        <!-- Sun Glow -->
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
          <stop offset="35%" stop-color="#fef08a" stop-opacity="0.85"/>
          <stop offset="75%" stop-color="#fde047" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
        </radialGradient>

        <!-- Mountain Gradient (Far) -->
        <linearGradient id="mountainFarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.75"/>
          <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9"/>
        </linearGradient>

        <!-- Mountain Gradient (Near) -->
        <linearGradient id="mountainNearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#86efac"/>
          <stop offset="100%" stop-color="#34d399"/>
        </linearGradient>

        <!-- Road Gradient -->
        <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="25%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <!-- Roadside Grass Verge Gradient -->
        <linearGradient id="vergeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#15803d"/>
          <stop offset="70%" stop-color="#16a34a"/>
          <stop offset="100%" stop-color="#22c55e"/>
        </linearGradient>

        <!-- Sidewalk Curb Gradient -->
        <linearGradient id="curbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#94a3b8"/>
          <stop offset="50%" stop-color="#cbd5e1"/>
          <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>

        <!-- Pelican Beak Pouch Gradient -->
        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="45%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>

        <!-- Pelican Body White Gradient -->
        <linearGradient id="pelicanBodyGrad" x1="25%" y1="0%" x2="75%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="65%" stop-color="#f1f5f9"/>
          <stop offset="100%" stop-color="#cbd5e1"/>
        </linearGradient>

        <!-- Bicycle Frame Gradient (Retro Mint Cyan) -->
        <linearGradient id="bikeFrameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0284c7"/>
          <stop offset="50%" stop-color="#06b6d4"/>
          <stop offset="100%" stop-color="#14b8a6"/>
        </linearGradient>

        <!-- Chrome Metallic Gradient -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc"/>
          <stop offset="40%" stop-color="#94a3b8"/>
          <stop offset="60%" stop-color="#f1f5f9"/>
          <stop offset="100%" stop-color="#64748b"/>
        </linearGradient>

        <!-- Wheel Tire Dark -->
        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <!-- Tree Foliage Gradient 1 (Emerald Oak) -->
        <linearGradient id="treeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4ade80"/>
          <stop offset="50%" stop-color="#22c55e"/>
          <stop offset="100%" stop-color="#15803d"/>
        </linearGradient>

        <!-- Tree Foliage Gradient 2 (Golden Ginkgo) -->
        <linearGradient id="treeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#facc15"/>
          <stop offset="55%" stop-color="#eab308"/>
          <stop offset="100%" stop-color="#ca8a04"/>
        </linearGradient>

        <!-- Tree Foliage Gradient 3 (Teal Cypress) -->
        <linearGradient id="treeGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2dd4bf"/>
          <stop offset="50%" stop-color="#0d9488"/>
          <stop offset="100%" stop-color="#115e59"/>
        </linearGradient>

        <!-- Tree Foliage Gradient 4 (Sakura Blossom Pink) -->
        <linearGradient id="treeGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fbcfe8"/>
          <stop offset="50%" stop-color="#f472b6"/>
          <stop offset="100%" stop-color="#db2777"/>
        </linearGradient>

        <!-- Headlight Beam Gradient -->
        <linearGradient id="headlightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
          <stop offset="35%" stop-color="#fde047" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
        </linearGradient>

        <!-- Drop Shadow Filter -->
        <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
        </filter>

        <!-- Ground Contact Shadow Filter -->
        <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
        </filter>
      </defs>

      <!-- 1. SKY BACKGROUND -->
      <rect id="skyRect" x="0" y="0" width="1200" height="700" fill="url(#skyGradDay)" style="transition: fill 0.8s ease;"/>

      <!-- CELESTIAL BODY (Sun or Moon) -->
      <g id="celestialGroup" transform="translate(1000, 110)">
        <circle id="sunGlowCircle" cx="0" cy="0" r="115" fill="url(#sunGlow)"/>
        <circle id="sunCoreCircle" cx="0" cy="0" r="42" fill="#fffbeb"/>
        <!-- Moon crater details (hidden by default in Day) -->
        <g id="moonDetails" opacity="0">
          <circle cx="-10" cy="-8" r="8" fill="#cbd5e1" opacity="0.45"/>
          <circle cx="12" cy="10" r="12" fill="#cbd5e1" opacity="0.45"/>
          <circle cx="16" cy="-12" r="6" fill="#cbd5e1" opacity="0.38"/>
        </g>
      </g>

      <!-- STARS LAYER (for night mode) -->
      <g id="starsLayer" opacity="0">
        <circle cx="80" cy="60" r="1.5" fill="#fff" opacity="0.8"/>
        <circle cx="220" cy="90" r="2" fill="#fff" opacity="0.9"/>
        <circle cx="340" cy="45" r="1.2" fill="#fff" opacity="0.6"/>
        <circle cx="490" cy="80" r="2.2" fill="#fff" opacity="0.8"/>
        <circle cx="620" cy="50" r="1.5" fill="#fff" opacity="0.7"/>
        <circle cx="780" cy="70" r="2" fill="#fff" opacity="0.9"/>
        <circle cx="910" cy="35" r="1.2" fill="#fff" opacity="0.75"/>
        <circle cx="1120" cy="95" r="1.8" fill="#fff" opacity="0.85"/>
      </g>

      <!-- 2. CLOUDS LAYER (Drifting Slowly) -->
      <g id="cloudsLayer">
        <!-- Cloud Group 1 -->
        <g id="cloud1" transform="translate(150, 100)" opacity="0.85">
          <path d="M 0 30 Q 15 10 40 20 Q 60 -5 95 10 Q 130 5 145 25 Q 165 30 160 45 Q 150 60 120 58 L 20 58 Q -10 55 0 30 Z" fill="#ffffff" filter="url(#softShadow)"/>
        </g>
        <!-- Cloud Group 2 -->
        <g id="cloud2" transform="translate(680, 70)" opacity="0.9">
          <path d="M 0 35 Q 20 5 55 15 Q 85 -10 130 10 Q 165 0 190 25 Q 215 35 205 55 L 25 55 Q -15 50 0 35 Z" fill="#ffffff" filter="url(#softShadow)"/>
        </g>
        <!-- Cloud Group 3 -->
        <g id="cloud3" transform="translate(1020, 140)" opacity="0.75">
          <path d="M 0 25 Q 20 10 40 20 Q 65 0 100 15 Q 130 20 125 40 L 15 40 Q -10 38 0 25 Z" fill="#ffffff"/>
        </g>
      </g>

      <!-- 3. DISTANT MOUNTAINS / HILLS (Parallax Level 1) -->
      <g id="distantHillsLayer">
        <path id="farMountains" d="M 0 420 Q 120 320 280 370 T 600 340 T 920 380 T 1250 330 L 1250 490 L 0 490 Z" fill="url(#mountainFarGrad)"/>
        <path id="nearHills" d="M 0 440 Q 150 380 360 415 T 750 395 T 1100 410 T 1300 390 L 1300 490 L 0 490 Z" fill="url(#mountainNearGrad)" opacity="0.85"/>
      </g>

      <!-- 4. ROADSIDE VERGE & GREENERY (行道绿化带) -->
      <g id="vergeLayer">
        <!-- Grass strip -->
        <rect x="0" y="440" width="1200" height="55" fill="url(#vergeGrad)"/>
        <!-- Continuous background bush silhouettes -->
        <g id="distantBushes" fill="#15803d" opacity="0.65">
          <ellipse cx="60" cy="452" rx="35" ry="12"/>
          <ellipse cx="150" cy="454" rx="50" ry="15"/>
          <ellipse cx="320" cy="450" rx="40" ry="14"/>
          <ellipse cx="500" cy="453" rx="55" ry="16"/>
          <ellipse cx="730" cy="451" rx="45" ry="15"/>
          <ellipse cx="950" cy="454" rx="60" ry="18"/>
          <ellipse cx="1130" cy="451" rx="40" ry="13"/>
        </g>
      </g>

      <!-- 5. SCROLLING TREES & STREET ELEMENTS LAYER (行道树 - Parallax Level 2) -->
      <g id="treeLayer"></g>

      <!-- Roadside Wildflowers & Grass Tufts (路旁野花与草丛) -->
      <g id="vergeFloraLayer"></g>

      <!-- 6. SIDEWALK CURB (人行道路牙石) -->
      <rect x="0" y="482" width="1200" height="14" fill="url(#curbGrad)"/>
      <!-- Curb segment joints (animated in JS) -->
      <g id="curbJointsLayer" stroke="#475569" stroke-width="2" opacity="0.55"></g>

      <!-- 7. MAIN ROAD PAVEMENT (沥青路面) -->
      <rect x="0" y="496" width="1200" height="204" fill="url(#roadGrad)"/>

      <!-- Asphalt grain / road highlight -->
      <line x1="0" y1="498" x2="1200" y2="498" stroke="#64748b" stroke-width="2.5" opacity="0.6"/>

      <!-- ROAD MARKINGS LAYER (路面标线 - Parallax Level 3) -->
      <!-- White Solid Edge Line (路侧连续白实线) -->
      <line x1="0" y1="510" x2="1200" y2="510" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.9"/>

      <!-- Yellow Center Safety Line (路中黄色分割线) -->
      <line x1="0" y1="675" x2="1200" y2="675" stroke="#f59e0b" stroke-width="5" stroke-opacity="0.9"/>

      <!-- Dashed White Road Markings (中间虚线与专用道标线) -->
      <g id="roadDashesLayer"></g>

      <!-- Bike Lane Painted Stencil Marks (非机动车道地面自行车白色图示) -->
      <g id="bikeLaneMarkingsLayer"></g>

      <!-- 8. FOREGROUND DYNAMIC SHADOW (地面投影) -->
      <ellipse id="bikeShadow" cx="530" cy="628" rx="190" ry="16" fill="rgba(0, 0, 0, 0.45)" filter="url(#groundShadow)"/>

      <!-- 9. THE BICYCLE & PELICAN CHARACTER GROUP -->
      <g id="cyclistRiderGroup" style="animation: bikeJitter 0.35s infinite ease-in-out;">

        <!-- === HEADLIGHT BEAM (Night / Sunset mode) === -->
        <polygon id="lightBeamPolygon" points="668,435 1200,350 1200,660 675,455" fill="url(#headlightBeam)" opacity="0" pointer-events="none"/>

        <!-- === REAR WHEEL (后轮) === -->
        <g id="rearWheelGroup" transform="translate(390, 560)">
          <!-- Tire & Rim -->
          <circle cx="0" cy="0" r="66" fill="none" stroke="url(#tireGrad)" stroke-width="12" filter="url(#softShadow)"/>
          <circle cx="0" cy="0" r="60" fill="none" stroke="url(#chromeGrad)" stroke-width="4"/>
          <circle cx="0" cy="0" r="58" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6"/>
          <!-- Spokes Group (Spins via JS) -->
          <g id="rearSpokes" stroke="url(#chromeGrad)" stroke-width="1.8" opacity="0.85">
            <line x1="-58" y1="0" x2="58" y2="0"/>
            <line x1="0" y1="-58" x2="0" y2="58"/>
            <line x1="-41" y1="-41" x2="41" y2="41"/>
            <line x1="-41" y1="41" x2="41" y2="-41"/>
            <line x1="-54" y1="-22" x2="54" y2="22"/>
            <line x1="-54" y1="22" x2="54" y2="-22"/>
            <line x1="-22" y1="-54" x2="22" y2="54"/>
            <line x1="-22" y1="54" x2="22" y2="-54"/>
          </g>
          <!-- Wheel Hub & Reflector -->
          <circle cx="0" cy="0" r="10" fill="url(#chromeGrad)"/>
          <circle cx="0" cy="0" r="5" fill="#475569"/>
          <!-- Orange Spoke Reflector -->
          <rect x="20" y="-7" width="18" height="8" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="1"/>
        </g>

        <!-- === FAR SIDE PEDAL & CRANK (远侧脚踏，车架后) === -->
        <g id="farPedalGroup">
          <line id="farCrankArm" x1="515" y1="545" x2="515" y2="517" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
          <rect id="farPedalPlatform" x="502" y="513" width="26" height="8" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
        </g>

          <ellipse cx="30" cy="150" rx="28" ry="6" fill="rgba(0,0,0,0.2)"/>
          <path d="M 30 150 L 30 50 Q 25 30 10 15 M 30 45 Q 35 25 45 10" stroke="#92400e" stroke-width="9" stroke-linecap="round" fill="none"/>
          <ellipse cx="30" cy="20" rx="42" ry="54" fill="url(#treeGrad2)" filter="url(#softShadow)"/>
          <ellipse cx="28" cy="15" rx="32" ry="42" fill="#fde047" opacity="0.5"/>
        `;
      } else if (type === 2) {
        // Tiered Modern Cypress (层次松柏树)
        return `
          <ellipse cx="30" cy="150" rx="26" ry="6" fill="rgba(0,0,0,0.22)"/>
          <path d="M 30 150 L 30 70" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
          <polygon points="30,-15 65,40 -5,40" fill="url(#treeGrad3)" filter="url(#softShadow)"/>
          <polygon points="30,20 72,70 -12,70" fill="url(#treeGrad3)" filter="url(#softShadow)"/>
          <polygon points="30,50 80,105 -20,105" fill="url(#treeGrad3)" filter="url(#softShadow)"/>
        `;
      } else {
        // Flowering Pink Sakura Tree (浪漫樱花行道树)
        return `
          <ellipse cx="32" cy="150" rx="34" ry="7" fill="rgba(0,0,0,0.2)"/>
          <path d="M 32 150 L 32 60 Q 26 40 12 25 M 32 55 Q 40 35 52 20" stroke="#581c87" stroke-width="10" stroke-linecap="round" fill="none"/>
          <circle cx="16" cy="26" r="30" fill="url(#treeGrad4)" filter="url(#softShadow)"/>
          <circle cx="52" cy="24" r="32" fill="url(#treeGrad4)" filter="url(#softShadow)"/>
          <circle cx="34" cy="-3" r="36" fill="url(#treeGrad4)" filter="url(#softShadow)"/>
          <circle cx="34" cy="15" r="25" fill="#fbcfe8" opacity="0.6"/>
        `;
      }
    }

    for (let i = 0; i < TREE_COUNT; i++) {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const treeType = i % 4;
      g.innerHTML = createTreeSVG(treeType);

      // Periodic vintage streetlight
      if (i % 3 === 1) {
        const lamp = document.createElementNS("http://www.w3.org/2000/svg", "g");
        lamp.setAttribute("transform", "translate(115, -10)");
        lamp.innerHTML = `
          <!-- Modern Streetlight Pole (复古行道灯) -->
          <path d="M 10 160 L 10 40 Q 10 15 35 15 L 45 15" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M 38 15 L 52 15 L 48 26 L 42 26 Z" fill="#64748b"/>
          <ellipse cx="45" cy="26" rx="5" ry="3" fill="#fef08a" id="streetLampBulb"/>
          <polygon points="40,28 15,160 75,160 50,28" fill="url(#headlightBeam)" opacity="0" id="lampGlowCone"/>
        `;
        g.appendChild(lamp);
      }

      treeLayer.appendChild(g);
      trees.push({
        el: g,
        basePos: i * TREE_SPACING,
        y: 335
      });
    }

    // --- 4. 2-Bone Inverse Kinematics (IK) for Bicycling Legs ---
    function solveLegIK(hip, pedal, l1, l2) {
      const dx = pedal.x - hip.x;
      const dy = pedal.y - hip.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Clamping to avoid mathematical breakdown
      const safeDist = Math.max(15, Math.min(l1 + l2 - 1.5, dist));
      const baseAngle = Math.atan2(dy, dx);

      // Cosine rule
      const cosAlpha = (l1 * l1 + safeDist * safeDist - l2 * l2) / (2 * l1 * safeDist);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

      // Knee projects forward toward the bike handlebars
      const kneeAngle = baseAngle - alpha;

      const kneeX = hip.x + l1 * Math.cos(kneeAngle);
      const kneeY = hip.y + l1 * Math.sin(kneeAngle);

      return {
        knee: { x: kneeX, y: kneeY },
        pedal: { x: pedal.x, y: pedal.y }
      };
    }

    // --- 5. Web Audio API Sound Synthesizers ---
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Two-tone bell "Ding-Ding!"
    window.ringBell = function() {
      const ctx = getAudioContext();
      if (!ctx) return;

      showToast("🔔 叮铃~ 叮铃！");

      const playChime = (freq, delay, dur) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);

        gain.gain.setValueAtTime(0, ctx.currentTime + delay);
        gain.gain.linearRampToValueAtTime(0.42, ctx.currentTime + delay + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + dur);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + dur);
      };

      playChime(2093, 0.0, 0.45); // C7
      playChime(2637, 0.02, 0.4); // E7
      playChime(2093, 0.14, 0.55); // Second ding
      playChime(2793, 0.16, 0.5); // F7

      // Wiggle bell icon in SVG
      const bellEl = document.getElementById('bikeBellGroup');
      if (bellEl) {
        bellEl.animate([
          { transform: 'rotate(0deg)' },
          { transform: 'rotate(-16deg)' },
          { transform: 'rotate(16deg)' },
          { transform: 'rotate(0deg)' }
        ], { duration: 240, iterations: 2 });
      }
    };

    // Playful cartoon pelican honk
    window.pelicanHonk = function() {
      const ctx = getAudioContext();
      if (!ctx) return;

      showToast("🎺 嘎！—— 鹈鹕欢快鸣叫");

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(260, ctx.currentTime + 0.12);
      osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.35);

      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.38);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 0.38);

      // Pouch jiggle
      const pouch = document.getElementById('pelicanPouch');
      if (pouch) {
        pouch.animate([
          { transform: 'scale(1)' },
          { transform: 'scale(1.15, 1.25)' },
          { transform: 'scale(0.95, 0.92)' },
          { transform: 'scale(1)' }
        ], { duration: 380 });
      }
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    // --- 6. Control Handlers & Keyboard Shortcuts ---
    window.togglePlay = function() {
      isPlaying = !isPlaying;
      document.getElementById('playText').textContent = isPlaying ? "暂停" : "继续";
      document.getElementById('playIcon').textContent = isPlaying ? "⏸️" : "▶️";
      if (isPlaying) {
        lastTime = performance.now();
        requestAnimationFrame(renderLoop);
      }
    };

    window.changeSpeed = function(val) {
      speedMult = parseFloat(val);
      document.getElementById('speedIndicator').textContent = `巡航速度: ${speedMult.toFixed(1)}x`;
      document.getElementById('speedSlider').value = speedMult;
    };

    window.cycleTheme = function() {
      const themes = ['day', 'sunset', 'night'];
      const nextIdx = (themes.indexOf(currentTheme) + 1) % themes.length;
      setTheme(themes[nextIdx]);
    };

    function setTheme(theme) {
      currentTheme = theme;
      const skyRect = document.getElementById('skyRect');
      const sunCore = document.getElementById('sunCoreCircle');
      const sunGlow = document.getElementById('sunGlowCircle');
      const stars = document.getElementById('starsLayer');
      const moonDetails = document.getElementById('moonDetails');
      const themeText = document.getElementById('themeText');
      const themeIcon = document.getElementById('themeIcon');
      const lightBeam = document.getElementById('lightBeamPolygon');
      const lampCones = document.querySelectorAll('#lampGlowCone');
      const body = document.body;

      if (theme === 'day') {
        skyRect.setAttribute('fill', 'url(#skyGradDay)');
        sunCore.setAttribute('fill', '#fffbeb');
        sunGlow.setAttribute('fill', 'url(#sunGlow)');
        stars.setAttribute('opacity', '0');
        moonDetails.setAttribute('opacity', '0');
        lightBeam.setAttribute('opacity', '0');
        lampCones.forEach(c => c.setAttribute('opacity', '0'));
        themeText.textContent = "日间";
        themeIcon.textContent = "☀️";
        body.style.background = "#090d16";
      } else if (theme === 'sunset') {
        skyRect.setAttribute('fill', 'url(#skyGradSunset)');
        sunCore.setAttribute('fill', '#fed7aa');
        sunGlow.setAttribute('fill', 'url(#sunGlow)');
        stars.setAttribute('opacity', '0.2');
        moonDetails.setAttribute('opacity', '0');
        lightBeam.setAttribute('opacity', '0.35');
        lampCones.forEach(c => c.setAttribute('opacity', '0.35'));
        themeText.textContent = "黄昏";
        themeIcon.textContent = "🌅";
        body.style.background = "#281216";
      } else { // night
        skyRect.setAttribute('fill', 'url(#skyGradNight)');
        sunCore.setAttribute('fill', '#f1f5f9');
        sunGlow.setAttribute('fill', 'none');
        stars.setAttribute('opacity', '1');
        moonDetails.setAttribute('opacity', '0.65');
        lightBeam.setAttribute('opacity', '0.85');
        lampCones.forEach(c => c.setAttribute('opacity', '0.7'));
        themeText.textContent = "星夜";
        themeIcon.textContent = "🌙";
        body.style.background = "#020617";
      }
    }

    // Keyboard Shortcuts listener
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyB') {
        ringBell();
      } else if (e.code === 'KeyH') {
        pelicanHonk();
      } else if (e.code === 'KeyT') {
        cycleTheme();
      } else if (e.code === 'ArrowUp') {
        changeSpeed(Math.min(2.8, speedMult + 0.2));
      } else if (e.code === 'ArrowDown') {
        changeSpeed(Math.max(0.2, speedMult - 0.2));
      }
    });

    // --- 7. Main Dynamic Animation Loop ---
    function renderLoop(now) {
      if (!isPlaying) return;

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const effectiveSpeed = speedMult * 60 * dt;

      // Advance Pedaling & Wheel Rotation
      const pedalingRate = 0.082 * effectiveSpeed;
      pedalAngle = (pedalAngle + pedalingRate) % (Math.PI * 2);

      wheelRotation = (wheelRotation + 6.4 * effectiveSpeed) % 360;
      document.getElementById('rearSpokes').setAttribute('transform', `rotate(${wheelRotation})`);
      document.getElementById('frontSpokes').setAttribute('transform', `rotate(${wheelRotation})`);

      // Parallax 1: Road Dashes (Fast)
      roadDashOffset = (roadDashOffset + 9.5 * effectiveSpeed) % DASH_SPACING;
      dashes.forEach((d, i) => {
        const x = (i * DASH_SPACING) - roadDashOffset - 50;
        d.setAttribute('x', x);
      });

      // Parallax 2: Stenciled Bike Lane Icons
      bikeMarkingOffset = (bikeMarkingOffset + 9.5 * effectiveSpeed) % 1860;
      bikeIcons.forEach((item) => {
        let x = (item.basePos - bikeMarkingOffset);
        if (x < -150) x += 1860;
        item.el.setAttribute('transform', `translate(${x}, 532) scale(0.65)`);
      });

      // Parallax 3: Sidewalk Curb Joints
      curbOffset = (curbOffset + 9.5 * effectiveSpeed) % CURB_SPACING;
      curbLines.forEach((cl, i) => {
        const x = (i * CURB_SPACING) - curbOffset - 30;
        cl.setAttribute('x1', x);
        cl.setAttribute('x2', x);
      });

      // Parallax 4: Roadside Flora (Wildflowers & Grass)
      const floraTotalSpan = FLORA_COUNT * FLORA_SPACING;
      floraOffset = (floraOffset + 7.5 * effectiveSpeed) % floraTotalSpan;
      floraItems.forEach((f) => {
        let x = (f.basePos - floraOffset);
        if (x < -60) x += floraTotalSpan;
        f.el.setAttribute('transform', `translate(${x}, ${f.y})`);
      });

      // Parallax 5: Roadside Trees & Streetlamps
      const treeTotalSpan = TREE_COUNT * TREE_SPACING;
      treeOffset = (treeOffset + 4.8 * effectiveSpeed) % treeTotalSpan;
      trees.forEach((tree) => {
        let x = (tree.basePos - treeOffset);
        if (x < -180) x += treeTotalSpan;
        tree.el.setAttribute('transform', `translate(${x}, ${tree.y})`);
      });

      // Parallax 6: Near Hills
      hillsNearOffset = (hillsNearOffset + 1.2 * effectiveSpeed) % 600;
      document.getElementById('nearHills').setAttribute('transform', `translate(${-hillsNearOffset}, 0)`);

      // Parallax 7: Far Mountains
      hillsFarOffset = (hillsFarOffset + 0.4 * effectiveSpeed) % 650;
      document.getElementById('farMountains').setAttribute('transform', `translate(${-hillsFarOffset}, 0)`);

      // Parallax 8: Drifting Clouds
      const cloudEls = [document.getElementById('cloud1'), document.getElementById('cloud2'), document.getElementById('cloud3')];
      const cloudSpeeds = [0.25, 0.4, 0.18];
      cloudEls.forEach((c, idx) => {
        cloudOffsets[idx] = (cloudOffsets[idx] - cloudSpeeds[idx] * effectiveSpeed);
        if (cloudOffsets[idx] < -250) cloudOffsets[idx] = 1250;
        c.setAttribute('transform', `translate(${cloudOffsets[idx]}, ${[100, 70, 140][idx]})`);
      });

      // --- Kinematic Leg Pedaling Physics ---
      // Near Pedal Coordinates (Revolving around bottom bracket)
      const nearPedalPos = {
        x: CRANK_CENTER.x + Math.sin(pedalAngle) * CRANK_RADIUS,
        y: CRANK_CENTER.y + Math.cos(pedalAngle) * CRANK_RADIUS
      };

      // Far Pedal Coordinates (180 deg out of phase)
      const farPedalPos = {
        x: CRANK_CENTER.x + Math.sin(pedalAngle + Math.PI) * CRANK_RADIUS,
        y: CRANK_CENTER.y + Math.cos(pedalAngle + Math.PI) * CRANK_RADIUS
      };

      // Update Near Crank Arm & Platform
      const nearCrankArm = document.getElementById('nearCrankArm');
      nearCrankArm.setAttribute('x2', nearPedalPos.x);
      nearCrankArm.setAttribute('y2', nearPedalPos.y);

      const nearPlatform = document.getElementById('nearPedalPlatform');
      nearPlatform.setAttribute('x', nearPedalPos.x - 15);
      nearPlatform.setAttribute('y', nearPedalPos.y - 4);
      document.getElementById('nearPedalReflector').setAttribute('cx', nearPedalPos.x - 11);
      document.getElementById('nearPedalReflector').setAttribute('cy', nearPedalPos.y);
      document.getElementById('nearPedalReflector2').setAttribute('cx', nearPedalPos.x + 11);
      document.getElementById('nearPedalReflector2').setAttribute('cy', nearPedalPos.y);

      // Update Far Crank Arm & Platform
      const farCrankArm = document.getElementById('farCrankArm');
      farCrankArm.setAttribute('x2', farPedalPos.x);
      farCrankArm.setAttribute('y2', farPedalPos.y);

      const farPlatform = document.getElementById('farPedalPlatform');
      farPlatform.setAttribute('x', farPedalPos.x - 13);
      farPlatform.setAttribute('y', farPedalPos.y - 4);

      // 1. Solve Near Leg IK
      const nearIK = solveLegIK(HIP_NEAR, nearPedalPos, THIGH_LEN, SHANK_LEN);

      // Near Thigh Feather Bloom (羽毛大腿根轮廓)
      const thighNormX = -(nearIK.knee.y - HIP_NEAR.y) * 0.16;
      const thighNormY = (nearIK.knee.x - HIP_NEAR.x) * 0.16;
      const nearBloomPath = `
        M ${HIP_NEAR.x - 12} ${HIP_NEAR.y}
        Q ${HIP_NEAR.x + thighNormX} ${HIP_NEAR.y + thighNormY} ${nearIK.knee.x} ${nearIK.knee.y}
        Q ${HIP_NEAR.x - thighNormX} ${HIP_NEAR.y - thighNormY} ${HIP_NEAR.x + 12} ${HIP_NEAR.y}
        Z
      `;
      document.getElementById('nearThighBloom').setAttribute('d', nearBloomPath);

      // Near Shank (小腿)
      const nearShank = document.getElementById('nearShankLine');
      nearShank.setAttribute('x1', nearIK.knee.x);
      nearShank.setAttribute('y1', nearIK.knee.y);
      nearShank.setAttribute('x2', nearPedalPos.x);
      nearShank.setAttribute('y2', nearPedalPos.y);

      const nearShankHi = document.getElementById('nearShankHighlight');
      nearShankHi.setAttribute('x1', nearIK.knee.x);
      nearShankHi.setAttribute('y1', nearIK.knee.y);
      nearShankHi.setAttribute('x2', nearPedalPos.x);
      nearShankHi.setAttribute('y2', nearPedalPos.y);

      // Near Webbed Foot (生动的橘色大脚蹼，踏于脚踏板上)
      const nearFootPts = [
        `${nearPedalPos.x - 14},${nearPedalPos.y - 3}`,
        `${nearPedalPos.x + 12},${nearPedalPos.y - 4}`,
        `${nearPedalPos.x + 24},${nearPedalPos.y + 4}`,
        `${nearPedalPos.x + 10},${nearPedalPos.y + 7}`,
        `${nearPedalPos.x - 10},${nearPedalPos.y + 5}`
      ].join(' ');
      document.getElementById('nearFootPoly').setAttribute('points', nearFootPts);

      // 2. Solve Far Leg IK
      const farIK = solveLegIK(HIP_FAR, farPedalPos, THIGH_LEN, SHANK_LEN);

      const farNormX = -(farIK.knee.y - HIP_FAR.y) * 0.14;
      const farNormY = (farIK.knee.x - HIP_FAR.x) * 0.14;
      const farBloomPath = `
        M ${HIP_FAR.x - 10} ${HIP_FAR.y}
        Q ${HIP_FAR.x + farNormX} ${HIP_FAR.y + farNormY} ${farIK.knee.x} ${farIK.knee.y}
        Q ${HIP_FAR.x - farNormX} ${HIP_FAR.y - farNormY} ${HIP_FAR.x + 10} ${HIP_FAR.y}
        Z
      `;
      document.getElementById('farThighBloom').setAttribute('d', farBloomPath);

      const farShank = document.getElementById('farShankLine');
      farShank.setAttribute('x1', farIK.knee.x);
      farShank.setAttribute('y1', farIK.knee.y);
      farShank.setAttribute('x2', farPedalPos.x);
      farShank.setAttribute('y2', farPedalPos.y);

      const farFootPts = [
        `${farPedalPos.x - 12},${farPedalPos.y - 3}`,
        `${farPedalPos.x + 10},${farPedalPos.y - 4}`,
        `${farPedalPos.x + 20},${farPedalPos.y + 4}`,
        `${farPedalPos.x + 8},${farPedalPos.y + 6}`,
        `${farPedalPos.x - 8},${farPedalPos.y + 5}`
      ].join(' ');
      document.getElementById('farFootPoly').setAttribute('points', farFootPts);

      requestAnimationFrame(renderLoop);
    }

    // Launch Animation Loop on Load
    window.addEventListener('DOMContentLoaded', () => {
      renderLoop(performance.now());
    });
  </script>
